name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Run tests on Windows (GUI 포함)
        run: python -m pytest -q
      - name: Build single exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ShortTest
          --collect-submodules shorttest
          shorttest/__main__.py
      - name: Smoke-run the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ShortTest.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "ShortTest.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
      - name: Assemble zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package\ShortTest | Out-Null
          Copy-Item dist\ShortTest.exe package\ShortTest\
          Copy-Item -Recurse examples package\ShortTest\examples
          Copy-Item docs\FORMAT.md package\ShortTest\문제지_작성법.md
          Copy-Item README.md package\ShortTest\
          Compress-Archive -Path package\ShortTest -DestinationPath ShortTest-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ShortTest-windows
          path: |
            dist/ShortTest.exe
            ShortTest-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShortTest.exe
            ShortTest-windows.zip
